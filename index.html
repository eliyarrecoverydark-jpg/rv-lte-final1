<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Engineering R.V - 4G LTE</title>

<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<!-- فونت‌های فارسی و انگلیسی مدرن -->
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Montserrat:wght@700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Vazirmatn', sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: radial-gradient(circle at 50% 10%, #0040ff 0%, #001861 45%, #00061a 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* ۱. صفحه لودینگ (Splash Screen) */
  #splash-screen {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #141821 0%, #050608 100%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }

  #splash-screen.fade-out {
    opacity: 0;
    visibility: hidden;
  }

  .splash-logo-box {
    width: 230px;
    height: auto;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0, 153, 255, 0.25);
    animation: pulseGlow 2s infinite alternate ease-in-out;
    margin-bottom: 35px;
  }

  .splash-logo-box img {
    width: 100%;
    display: block;
  }

  @keyframes pulseGlow {
    0% { transform: scale(0.97); box-shadow: 0 0 20px rgba(0, 153, 255, 0.15); }
    100% { transform: scale(1.03); box-shadow: 0 0 45px rgba(0, 170, 255, 0.5); }
  }

  .loader-bar {
    width: 180px;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.6);
  }

  .loader-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #0066ff, #00e1ff);
    border-radius: 10px;
    box-shadow: 0 0 12px #00e1ff;
    animation: loadProgress 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes loadProgress {
    0% { width: 0%; }
    60% { width: 75%; }
    100% { width: 100%; }
  }

  .loading-text {
    margin-top: 14px;
    font-size: 13px;
    color: #8ab4f8;
    letter-spacing: 1px;
    font-weight: 700;
  }

  /* ۲. کانتینر اصلی برنامه */
  .app-wrapper {
    width: 100%;
    max-width: 390px;
    text-align: center;
    position: relative;
    animation: fadeInUp 0.6s ease;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .app-header {
    margin-bottom: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .playstore-icon {
    width: 108px;
    height: 108px;
    border-radius: 26px;
    object-fit: cover;
    border: 2px solid rgba(51, 187, 255, 0.7);
    box-shadow: 
      0 10px 25px rgba(0, 0, 0, 0.6),
      0 0 28px rgba(0, 140, 255, 0.55);
    margin-bottom: 12px;
  }

  .brand-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: #80e1ff;
    text-shadow: 0 0 15px rgba(0, 170, 255, 0.6);
  }

  /* ۳. استایل دکمه‌های کپسولی نئونی */
  .capsule-btn {
    width: 100%;
    height: 78px;
    margin-bottom: 22px;
    border-radius: 50px;
    background: linear-gradient(180deg, rgba(35, 150, 255, 0.6) 0%, rgba(0, 42, 168, 0.9) 52%, rgba(0, 95, 255, 0.7) 100%);
    border: 2px solid #47c4ff;
    box-shadow: 
      0 6px 24px rgba(0, 140, 255, 0.65),
      inset 0 3px 10px rgba(255, 255, 255, 0.55),
      inset 0 -3px 10px rgba(0, 210, 255, 0.5);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    text-decoration: none;
  }

  .capsule-btn:active {
    transform: scale(0.96);
    box-shadow: 0 0 14px rgba(0, 200, 255, 0.95);
  }

  .btn-title {
    font-family: 'Lalezar', 'Vazirmatn', sans-serif;
    font-size: 24px;
    font-weight: normal;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6), 0 0 12px rgba(102, 217, 255, 0.6);
  }

  .right-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .divider {
    width: 1.5px;
    height: 36px;
    background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.65), transparent);
  }

  .android-svg {
    width: 38px;
    height: 38px;
    fill: #78C257;
    filter: drop-shadow(0 0 6px rgba(120, 194, 87, 0.5));
  }

  .arrow-circle {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 162, 255, 0.65) 0%, rgba(0, 68, 204, 0.95) 100%);
    border: 1.5px solid #80e1ff;
    box-shadow: 0 0 10px rgba(0, 195, 255, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .arrow-circle svg {
    width: 18px;
    height: 18px;
    fill: #fff;
  }

  /* ۴. کادر شیشه‌ای پایین و لایسنس */
  .support-wrapper {
    position: relative;
    margin-top: 36px;
  }

  .top-mini-android {
    width: 34px;
    height: 34px;
    fill: #78C257;
    margin: 0 auto -12px auto;
    display: block;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 0 8px rgba(120, 194, 87, 0.55));
  }

  .glass-card {
    padding: 26px 18px 20px 18px;
    border-radius: 26px;
    background: linear-gradient(180deg, rgba(0, 42, 138, 0.55) 0%, rgba(0, 16, 60, 0.8) 100%);
    border: 1.5px solid rgba(65, 190, 255, 0.65);
    box-shadow: 0 8px 30px rgba(0, 90, 255, 0.35), inset 0 0 18px rgba(0, 120, 255, 0.2);
    backdrop-filter: blur(14px);
  }

  .support-text {
    font-size: 16.5px;
    line-height: 1.9;
    margin-bottom: 16px;
    font-weight: 800;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
  }

  .gold-text {
    font-family: 'Lalezar', 'Vazirmatn', sans-serif;
    font-size: 21px;
    font-weight: normal;
    color: #ffd659;
    text-shadow: 0 0 12px rgba(255, 214, 89, 0.45);
  }

  /* فونت و استایل جدید آیدی تلگرام */
  .tg-btn {
    height: 58px;
    margin-bottom: 0;
    direction: ltr;
    padding: 0 16px;
  }

  .tg-id-text {
    flex: 1;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1.2px;
    color: #ffffff;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6), 0 0 14px rgba(0, 217, 255, 0.75);
  }

  .tg-id-text span {
    color: #66e0ff;
    font-weight: 700;
    margin-right: 1px;
  }

  .tg-icon-circle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 180, 255, 0.6) 0%, rgba(0, 80, 200, 0.9) 100%);
    border: 1.5px solid #80e1ff;
    box-shadow: 0 0 10px rgba(0, 180, 255, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tg-icon-circle svg {
    width: 19px;
    height: 19px;
    fill: #fff;
  }

  /* ورودی لایسنس */
  .license-input {
    width: 100%;
    padding: 15px;
    border-radius: 50px;
    border: 1.5px solid #47c4ff;
    background: rgba(0, 14, 52, 0.8);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    margin: 18px 0;
    outline: none;
    box-shadow: inset 0 0 12px rgba(0, 162, 255, 0.35);
    direction: ltr;
  }

  .license-input::placeholder {
    color: rgba(255, 255, 255, 0.45);
    font-weight: 500;
  }

  .hidden {
    display: none !important;
  }

  .dev-reset {
    margin-top: 22px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px dashed rgba(255, 255, 255, 0.3);
    color: rgba(255, 255, 255, 0.6);
    padding: 6px 14px;
    border-radius: 12px;
    font-size: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>

<svg style="display: none;">
  <symbol id="android-logo" viewBox="0 0 24 24">
    <path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24c-2.86-1.21-6.08-1.21-8.94 0L5.65 5.67c-.19-.28-.54-.37-.83-.22-.3.16-.42.54-.26.85l1.84 3.18C4.1 10.79 2.58 13.06 2.5 15.75h19c-.08-2.69-1.6-4.96-3.9-6.27zM8.5 13.5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm7 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zM4 17v4c0 .55.45 1 1 1h1v2.5c0 .83.67 1.5 1.5 1.5S9 25.33 9 24.5V22h6v2.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V22h1c.55 0 1-.45 1-1v-4H4zm-2.5 0C.67 17 0 17.67 0 18.5v4c0 .83.67 1.5 1.5 1.5S3 23.33 3 22.5v-4C3 17.67 2.33 17 1.5 17zm21 0c-.83 0-1.5.67-1.5 1.5v4c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-4c0-.83-.67-1.5-1.5-1.5z"/>
  </symbol>
  <symbol id="chevron-right" viewBox="0 0 24 24">
    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
  </symbol>
  <symbol id="telegram-icon" viewBox="0 0 24 24">
    <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
  </symbol>
</svg>

<!-- ۱. صفحه انتظار (Splash Loading Screen) -->
<div id="splash-screen">
  <div class="splash-logo-box">
    <img src="splash.jpg" onerror="this.onerror=null; this.src='splash.png';" alt="RV Splash Logo">
  </div>
  <div class="loader-bar">
    <div class="loader-fill"></div>
  </div>
  <div class="loading-text">در حال بارگذاری...</div>
</div>

<!-- ۲. بدنه اصلی اپلیکیشن -->
<div class="app-wrapper">

  <div class="app-header">
    <img src="logo.jpg" onerror="this.onerror=null; this.src='logo.png';" alt="Engineering R.V Logo" class="playstore-icon">
    <div class="brand-title">ENGINEERING R.V</div>
  </div>

  <!-- بخش قفل لایسنس -->
  <div id="license-screen" class="glass-card">
    <h2 style="margin-bottom: 8px; color: #66d9ff; font-family: 'Lalezar'; font-size: 25px; font-weight: normal;">فعال‌سازی برنامه</h2>
    <p style="font-size: 14px; color: #cce6ff; font-weight: 600;">کد لایسنس یک‌بار مصرف خود را وارد کنید:</p>
    
    <input type="text" id="license-code" class="license-input" placeholder="کد لایسنس (تست: 12345)">
    
    <button class="capsule-btn" style="height: 62px; justify-content: center; margin-bottom: 8px;" onclick="verifyLicense()">
      <span class="btn-title">ورود و فعال‌سازی</span>
    </button>
    
    <p id="error-msg" style="color: #ff6b6b; font-size: 13.5px; font-weight: 700; display: none; margin-top: 8px;">
      ❌ کد لایسنس نامعتبر است یا قبلاً استفاده شده!
    </p>
  </div>

  <!-- بخش صفحه اصلی برنامه -->
  <div id="main-screen" class="hidden">
    
    <button class="capsule-btn" onclick="openRadioInfo('android11_plus')">
      <div class="right-group">
        <svg class="android-svg"><use href="#android-logo"></use></svg>
        <div class="divider"></div>
      </div>
      <span class="btn-title">متد اندروید +11</span>
      <div class="arrow-circle">
        <svg><use href="#chevron-right"></use></svg>
      </div>
    </button>

    <button class="capsule-btn" onclick="openRadioInfo('android_below_11')">
      <div class="right-group">
        <svg class="android-svg"><use href="#android-logo"></use></svg>
        <div class="divider"></div>
      </div>
      <span class="btn-title">اندروید کمتر از 11</span>
      <div class="arrow-circle">
        <svg><use href="#chevron-right"></use></svg>
      </div>
    </button>

    <div class="support-wrapper">
      <svg class="top-mini-android" viewBox="0 0 24 28"><use href="#android-logo"></use></svg>
      <div class="glass-card">
        <p class="support-text">
          اگر به مشکل خوردید با <span class="gold-text">مهندس علوی</span> در تماس باشید
        </p>
        <a href="https://t.me/recoverydark" target="_blank" class="capsule-btn tg-btn">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div class="tg-icon-circle">
              <svg><use href="#telegram-icon"></use></svg>
            </div>
            <div class="divider" style="height: 26px;"></div>
          </div>
          <div class="tg-id-text"><span>@</span>recoverydark</div>
        </a>
      </div>
    </div>

    <button class="dev-reset" onclick="resetLicense()">🔄 تست مجدد لودینگ و لایسنس</button>

  </div>

</div>

<script>
  window.onload = function() {
    if (localStorage.getItem("app_activated") === "true") {
      showMainScreen();
    }

    setTimeout(function() {
      document.getElementById("splash-screen").classList.add("fade-out");
    }, 2500);
  };

  function verifyLicense() {
    const code = document.getElementById("license-code").value.trim();
    if (code === "12345") {
      localStorage.setItem("app_activated", "true");
      showMainScreen();
    } else {
      document.getElementById("error-msg").style.display = "block";
    }
  }

  function showMainScreen() {
    document.getElementById("license-screen").classList.add("hidden");
    document.getElementById("main-screen").classList.remove("hidden");
  }

  function resetLicense() {
    localStorage.removeItem("app_activated");
    location.reload();
  }

  function openRadioInfo(method) {
    if (window.AndroidBridge) {
      window.AndroidBridge.openMenu(method);
    } else {
      alert("این قابلیت در خروجی اندروید فعال می‌شود.");
    }
  }
</script>

</body>
</html>
