name: Build Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/rv/changelte
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable

          cp index.html app/src/main/assets/
          for f in *.jpg *.png *.JPG *.PNG; do
            [ -e "$f" ] && cp "$f" app/src/main/assets/
          done

          if [ -f "logo.png" ]; then
            ffmpeg -y -i logo.png -vf "scale=512:512" app/src/main/res/drawable/ic_launcher.png
          elif [ -f "logo.jpg" ]; then
            ffmpeg -y -i logo.jpg -vf "scale=512:512" app/src/main/res/drawable/ic_launcher.png
          else
            ffmpeg -y -f lavfi -i color=c=blue:s=512x512 -frames:v 1 app/src/main/res/drawable/ic_launcher.png
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EngineeringRV"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.rv.changelte'
              compileSdk 34

              defaultConfig {
                  applicationId "com.rv.changelte"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <package android:name="com.android.phone" />
                  <package android:name="com.android.settings" />
              </queries>
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Engineering R.V"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/rv/changelte/MainActivity.java
          package com.rv.changelte;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.parseColor("#001861"));
                  getWindow().setNavigationBarColor(Color.parseColor("#00061a"));

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("https://t.me/") || url.startsWith("tg://")) {
                              try {
                                  Intent tgIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(tgIntent);
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "برنامه تلگرام یافت نشد", Toast.LENGTH_SHORT).show();
                              }
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void openMenu(String method) {
                      runOnUiThread(() -> {
                          String[][] targets;
                          if ("android11_plus".equals(method)) {
                              targets = new String[][] {
                                  {"com.android.phone", "com.android.phone.settings.RadioInfo"},
                                  {"com.android.phone", "com.android.phone.RadioInfo"},
                                  {"com.android.settings", "com.android.settings.RadioInfo"}
                              };
                          } else {
                              targets = new String[][] {
                                  {"com.android.settings", "com.android.settings.RadioInfo"},
                                  {"com.android.phone", "com.android.phone.settings.RadioInfo"},
                                  {"com.android.phone", "com.android.phone.RadioInfo"}
                              };
                          }

                          boolean opened = false;
                          for (String[] target : targets) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_MAIN);
                                  intent.setComponent(new ComponentName(target[0], target[1]));
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(intent);
                                  opened = true;
                                  break;
                              } catch (Exception ignored) {
                              }
                          }

                          if (!opened) {
                              Toast.makeText(MainActivity.this, "منوی مخفی شبکه در این مدل گوشی در دسترس نیست", Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
          }
          EOF

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Engineering-RV-LTE-APK
          path: app/build/outputs/apk/release/app-release.apk
